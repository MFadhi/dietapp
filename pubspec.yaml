name: diet_app # TODO: rename (must match the project name used with `flutter create`)
description: Personalized diet planner built from lab values, weather and regional Indian foods.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Phase 1 ---
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1

  # --- Phase 2 ---
  drift: ^2.24.2
  drift_flutter: ^0.2.4

  # --- Added in later phases (kept here as a roadmap, uncomment when needed) ---
  # mobile_scanner, google_mlkit_text_recognition, dio     # Phase 3
  # geolocator                                             # Phase 4
  # flutter_local_notifications                            # Phase 5
  # fl_chart                                               # Phase 3
  # share_plus                                             # Phase 6
  # flutter_localizations + intl                           # Phase 7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/data/foods_seed.json
